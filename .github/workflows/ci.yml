name: CI

# Runs on every pull request and every push to main (D-42). No deployment happens here:
# hosting is decided at the hosting checkpoint HC-1 (D-81).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # mongodb-memory-server downloads a MongoDB binary for the API tests; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Style knowledge base: linter (FR-STY-03) and coverage report in the job summary (FR-STY-11).
      - run: pnpm --filter @styleme/api style-rules lint
      - run: pnpm --silent --filter @styleme/api style-rules coverage >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image (not pushed anywhere)
        run: docker build -f apps/api/Dockerfile -t styleme-api:ci .
