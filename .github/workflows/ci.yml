name: CI

# Runs on every pull request and every push to main (D-42). No deployment happens here:
# hosting is decided at the hosting checkpoint HC-1 (D-81).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # mongodb-memory-server downloads a MongoDB binary for the API tests; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Style knowledge base: linter (FR-STY-03) and coverage report in the job summary (FR-STY-11).
      - run: pnpm --filter @styleme/api style-rules lint
      # Draft content awaiting founder review (apps/api/style-rules-drafts): every check except NOT_APPROVED.
      - run: pnpm --filter @styleme/api style-rules drafts
      - run: pnpm --silent --filter @styleme/api style-rules coverage >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm test
      - run: pnpm build

  # Playwright E2E (TESTING.md §7, #36): builds the apps, starts an in-memory MongoDB, the API
  # (APP_ENV=local, dev outbox) and `next start`, then runs every spec at 375×812 and 1280×800.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # The Playwright version comes from the lockfile, so the browser cache follows it.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm e2e

      - name: Upload the Playwright report, traces and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/.logs/
          include-hidden-files: true
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image (not pushed anywhere)
        run: docker build -f apps/api/Dockerfile -t styleme-api:ci .
